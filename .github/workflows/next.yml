name: Next

on:
  workflow_dispatch:

concurrency:
  group: next-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-next:
    if: github.repository == 'Dosbodoke/better-zap'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      # The checkout action uses the ref selected for this workflow dispatch.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm release:require-changeset
      - run: pnpm version-packages:next
      - run: pnpm release:check-version:next
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm landing:typecheck
      - run: pnpm test
      - run: pnpm pack:check
      - name: Verify npm token
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::Missing NPM_TOKEN repository secret for next npm publishing."
            exit 1
          fi
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - run: pnpm release:publish:next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
