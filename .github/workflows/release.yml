name: Release

on:
  push:
    branches:
      - main

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      # Build before the changesets action publishes. Scoped @better-zap/*
      # packages gitignore their dist/, so without this step `changeset publish`
      # ships tarballs containing only LICENSE/README/package.json (see #52).
      # The root better-zap package happened to survive only because its dist/
      # is committed. pack:check then fails the release if any tarball is
      # missing a file its package.json exports/types point at.
      - run: pnpm build
      - run: pnpm pack:check
      - uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release:publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # setup-node's generated .npmrc authenticates via NODE_AUTH_TOKEN,
          # so the secret must be exposed under that name for `npm publish`.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_CONFIG_PROVENANCE: true
